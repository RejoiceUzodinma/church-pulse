<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vouch - Create Deal</title>
</head>
<body style="background-color: #f4f4f4; display: flex; justify-content: center;">

    <main style="width: 100%; max-width: 400px; background: white; min-height: 100vh; padding: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        
        <header>
            <h1 style="color: #004d40; font-family: sans-serif; text-align: center;">Vouch</h1>
            <p style="text-align: center; font-family: sans-serif; color: #666;">Secure your transaction in seconds.</p>
        </header>

        <hr>

        <section id="deal-creation">
            <h2 style="font-family: sans-serif; font-size: 1.2rem;">Create a New Deal</h2>
            
            <form>
                <label style="font-family: sans-serif; font-weight: bold;">What are you selling?</label><br>
                <input type="text" placeholder="e.g. iPhone 13 Pro" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px;"><br><br>

                <label style="font-family: sans-serif; font-weight: bold;">Price (₦)</label><br>
                <input type="number" placeholder="Enter Amount" style="width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px;"><br><br>

                <label style="font-family: sans-serif; font-weight: bold;">Product Photo (Optional)</label><br>
                <input type="file" accept="image/*" style="margin-top: 10px;"><br><br>

                <div style="margin-top: 25px; font-family: sans-serif; background: #f0fdf4; border: 1px solid #004d40; padding: 15px; border-radius: 12px;">
    <h3 style="font-size: 0.9rem; color: #004d40; margin-top: 0;">Earnings Estimate</h3>
    
    <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
        <tr>
            <td style="padding: 5px 0; color: #666;">Selling Price:</td>
            <td style="padding: 5px 0; text-align: right; font-weight: bold;">₦450,000</td>
        </tr>
        
        <tr>
            <td style="padding: 5px 0; color: #666;">Vouch Fee (Capped):</td>
            <td style="padding: 5px 0; text-align: right; color: #d32f2f;">- ₦7,500</td>
        </tr>

        <tr style="border-top: 1px dashed #004d40;">
            <td style="padding: 10px 0; font-weight: bold; color: #004d40;">Bank Settlement:</td>
            <td style="padding: 10px 0; text-align: right; font-weight: bold; font-size: 1.1rem; color: #004d40;">₦442,500</td>
        </tr>
    </table>
    
    <p style="font-size: 0.7rem; color: #004d40; margin-top: 10px; text-align: center;">
        <i>Vouch takes the fee so your Buyer pays exactly ₦450,000.</i>
    </p>
</div>

                <button type="button" style="width: 100%; background-color: #004d40; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;">
                    Generate Vouch Link
                    
                </button>
            </form>
        </section>

        <footer style="margin-top: 50px; text-align: center; font-size: 0.8rem; color: #999; font-family: sans-serif;">
            <p>© 2026 Vouch FinTech | Safe & Secure</p>
        </footer>

    </main>

</body>
</html>
